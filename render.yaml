services:
  - type: web
    name: nexus-breach
    runtime: node
    plan: starter        # free works for testing, but it sleeps and has very little CPU — use starter on event day
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus Breach · Big Screen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%2305060d%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22none%22 stroke=%22%23ff2bd6%22 stroke-width=%223%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%223%22 fill=%22%2322e1ff%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@1,500&family=Share+Tech+Mono&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: grid; grid-template-columns: 1fr minmax(340px, 26vw); height: 100vh; }
    #map { position: relative; overflow: hidden; }
    #map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #side { background: rgba(6,8,16,0.96); border-left: 1px solid var(--line); display: flex; flex-direction: column; padding: 2.2vh 1.4vw; gap: 1.6vh; overflow: hidden; }
    .s-title { font-family: var(--display); font-weight: 900; font-size: clamp(22px, 2.2vw, 40px); letter-spacing: 0.06em; color: #fff; text-shadow: 0 0 20px var(--magenta); }
    .s-phase { font-size: clamp(11px, 0.8vw, 15px); letter-spacing: 0.3em; color: var(--dim); }
    #s-timer { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 4.4vw, 84px); color: #fff; text-shadow: 0 0 24px rgba(34,225,255,0.6); line-height: 1; font-variant-numeric: tabular-nums; }
    #s-timer.low { color: var(--red); text-shadow: 0 0 24px var(--red); }
    #s-teams { display: flex; flex-direction: column; gap: 1vh; }
    .st { padding: 1.1vh 1vw; background: rgba(255,255,255,0.03); border-left: 4px solid var(--c); transition: transform 0.5s; }
    .st-top { display: flex; justify-content: space-between; align-items: baseline; }
    .st-name { font-family: var(--display); font-weight: 700; font-size: clamp(13px, 1.05vw, 20px); color: var(--c); letter-spacing: 0.06em; }
    .st-score { font-family: var(--display); font-weight: 900; font-size: clamp(18px, 1.6vw, 30px); }
    .st-slots { display: flex; gap: 4px; margin-top: 0.8vh; }
    .st-slots i { flex: 1; height: 8px; background: rgba(255,255,255,0.08); }
    .st-slots i.on { background: var(--c); box-shadow: 0 0 8px var(--c); }
    .st-sub { font-size: clamp(10px, 0.75vw, 14px); color: var(--dim); margin-top: 0.6vh; }
    .st .badge { color: var(--c); }
    #s-teams.compact { gap: 0.5vh; }
    #s-teams.compact .st { padding: 0.55vh 0.8vw; }
    #s-teams.compact .st-sub { display: none; }
    #s-teams.compact .st-slots { margin-top: 0.4vh; }
    #s-teams.compact .st-slots i { height: 5px; }
    #s-teams.compact .st-score { font-size: clamp(15px, 1.2vw, 24px); }
    #s-feed { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; mask-image: linear-gradient(to bottom, transparent, #000 30%); }
    #s-feed .feed-item { font-size: clamp(11px, 0.85vw, 16px); }
    #s-join { display: flex; gap: 1vw; align-items: center; padding-top: 1vh; border-top: 1px solid var(--line); }
    #s-join .qr { background: #fff; padding: 6px; line-height: 0; }
    #s-join .qr img, #s-join .qr svg { width: clamp(90px, 7vw, 150px); height: auto; }
    #s-join .url { font-size: clamp(12px, 1vw, 20px); color: var(--cyan); word-break: break-all; }
    #lobby-overlay { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse, rgba(3,4,10,0.6), rgba(3,4,10,0.92)); text-align: center; }
    #lobby-overlay h1 { font-family: var(--display); font-weight: 900; font-size: clamp(30px, 5vw, 96px); margin: 0; color: #fff; text-shadow: 0 0 40px var(--magenta); letter-spacing: 0.06em; }
    #lobby-overlay .sub { color: var(--dim); letter-spacing: 0.3em; margin: 1vh 0 3vh; font-size: clamp(12px, 1.1vw, 20px); }
    #lobby-overlay .bigqr { display: inline-block; background: #fff; padding: 14px; line-height: 0; box-shadow: 0 0 60px rgba(34,225,255,0.4); }
    #lobby-overlay .bigqr img, #lobby-overlay .bigqr svg { width: min(30vh, 22vw); height: auto; }
    #lobby-overlay .bigurl { font-family: var(--display); font-size: clamp(16px, 2vw, 36px); color: var(--cyan); margin-top: 2.4vh; text-shadow: 0 0 12px var(--cyan); }
    #lobby-overlay .count { margin-top: 2vh; font-size: clamp(14px, 1.3vw, 24px); color: var(--text); }
    #announce { left: 37%; }
  </style>
</head>
<body>
  <div id="map">
    <canvas id="screen-canvas"></canvas>
    <div id="lobby-overlay" class="hidden">
      <div>
        <h1 class="logo" data-text="NEXUS BREACH">NEXUS BREACH</h1>
        <div class="sub">SCAN TO JOIN THE RESISTANCE</div>
        <div class="bigqr" id="bigqr"></div>
        <div class="bigurl" id="bigurl"></div>
        <div class="count" id="lobby-count"></div>
      </div>
    </div>
  </div>
  <aside id="side">
    <div>
      <div class="s-title">NEXUS BREACH</div>
      <div class="s-phase" id="s-phase">STANDBY</div>
      <div id="s-timer">--:--</div>
    </div>
    <div id="s-teams"></div>
    <div id="s-feed"></div>
    <div id="s-join"><div class="qr" id="smallqr"></div><div><div class="s-phase">JOIN</div><div class="url" id="smallurl"></div></div></div>
  </aside>
  <div id="announce"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script type="module" src="/js/screen.js"></script>
</body>
</html>
